[project]
name = "notebooks"
version = "0.1.0"
description = "Notebooks for experiments and learning"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
local = [
    "ipykernel>=6.29",
]

[tool.uv]
package = false
